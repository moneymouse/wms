services:
  # ---------------------------------------------------------------------------
  # MySQL (Test)
  # ---------------------------------------------------------------------------
  mysql_test:
    image: mysql:lts
    container_name: wms_mysql_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_test_only
      MYSQL_DATABASE: wms_db_test
      MYSQL_USER: wms_user_test
      MYSQL_PASSWORD: wms_password_test_only
    volumes:
      - mysql_data_test:/var/lib/mysql
    # 仅用于本机排查数据库时连接；不建议暴露公网
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - wms_network_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_test_only"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Python / Flask backend (Test)
  # ---------------------------------------------------------------------------
  backend_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_backend_test
    restart: unless-stopped
    environment:
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      OAUTH_SESSION_SECRET: ${OAUTH_SESSION_SECRET:-}
      OAUTH_ALLOW_LOCAL_HTTP: ${OAUTH_ALLOW_LOCAL_HTTP:-false}
      DATABASE_URL: >-
        mysql+pymysql://wms_user_test:wms_password_test_only@mysql_test:3306/wms_db_test?charset=utf8mb4
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      TZ: Asia/Shanghai
      FLASK_ENV: testing
      ADMIN_PHONE: "admin"
      ADMIN_PASSWORD: "admin_123"
      ADMIN_NAME: "Test Admin"
    depends_on:
      mysql_test:
        condition: service_healthy
    volumes:
      - ./env.toml:/app/env.toml:ro
      - ./log_test:/app/log
      - ./excels_test:/app/excels
      - ./data/history_test:/app/data/history
      - ./uploads_test:/app/uploads
    networks:
      - wms_network_test
    expose:
      - "5000"

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy (Test Entry)
  # ---------------------------------------------------------------------------
  nginx_test:
    image: nginx:1.27-alpine
    container_name: wms_nginx_test
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
      - ../wms_frontend/build:/home/frontend:ro
    networks:
      - wms_network_test
    depends_on:
      - backend_test

  # Optional remote MCP service; backend alone owns migrations and admin setup.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment:
      DATABASE_URL: mysql+pymysql://wms_user_test:wms_password_test_only@mysql_test:3306/wms_db_test?charset=utf8mb4
      TZ: Asia/Shanghai
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      OAUTH_SESSION_SECRET: ${OAUTH_SESSION_SECRET:-}
      OAUTH_ALLOW_LOCAL_HTTP: ${OAUTH_ALLOW_LOCAL_HTTP:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      mysql_test:
        condition: service_healthy
    networks:
      - wms_network_test
    expose:
      - "8000"


volumes:
  mysql_data_test:

networks:
  wms_network_test:
    driver: bridge
