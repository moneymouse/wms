services:
  # ---------------------------------------------------------------------------
  # MySQL lts
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:lts
    container_name: wms_mysql
    restart: unless-stopped
    env_file:
      - DB.env
    volumes:
      - mysql_data:/var/lib/mysql
      # Note: schema.sql removed - Alembic manages database schema
    ports:
      # Only expose MySQL to the server itself. Containers use the internal network.
      - "127.0.0.1:3306:3306"
    networks:
      - wms_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Python / Flask backend (gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: wms_backend
    restart: unless-stopped
    env_file:
      - BK.env
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/app/log
      - ./excels:/app/excels
      - ./data/history:/app/data/history
      - ./uploads:/app/uploads
    networks:
      - wms_network
    expose:
      - "5000"

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: wms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../wms_frontend/build:/home/frontend
    networks:
      - wms_network
    depends_on:
      - backend

volumes:
  mysql_data:


networks:
  wms_network:
    driver: bridge
