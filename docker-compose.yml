services:
  # ---------------------------------------------------------------------------
  # MySQL lts
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:lts
    container_name: wms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: wms_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
      # Note: schema.sql removed - Alembic manages database schema
    ports:
      - "3306:3306"
    networks:
      - wms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
            "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Python / Flask backend (gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: >-
        mysql+pymysql://wms_user:wms_password_change_me@mysql:3306/wms_db?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/app/log
      - ./excels:/app/excels
      - ./data/history:/app/data/history
    networks:
      - wms_network
    expose:
      - "5000"

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: wms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wms_network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  wms_network:
    driver: bridge
