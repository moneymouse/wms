server {
    listen 80;
    server_name 8.166.137.88;

    # Both environments renew their IP certificate through the production webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /home/frontend;
        try_files $uri =404;
    }

    location / {
        return 308 https://8.166.137.88$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 8.166.137.88;
    error_page 497 =308 https://8.166.137.88$request_uri;
    ssl_certificate /etc/letsencrypt/live/wms-pre-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms-pre-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PROD_TLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    # Allow 24 MB of paper photos plus multipart overhead.
    client_max_body_size 25M;

    # ------------------------------------------------------------------
    # API requests → Flask backend
    # ------------------------------------------------------------------
    # Resolve at request time so rebuilding upstreams does not leave stale addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:5000;
    set $mcp_upstream mcp:8000;

    location = /mcp {
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://$mcp_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /oauth/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
    # ------------------------------------------------------------------
    # Frontend SPA - all other routes serve static files
    # ------------------------------------------------------------------
    location / {
        root /home/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
