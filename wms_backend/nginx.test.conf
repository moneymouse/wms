server {
    listen 80;
    server_name _;

    # Allow 24 MB of paper photos plus multipart overhead.
    client_max_body_size 25M;

    # ------------------------------------------------------------------
    # API requests -> Flask backend (Test)
    # ------------------------------------------------------------------
    # Resolve optional MCP service at request time so REST can run without it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_upstream mcp:8000;

    location = /mcp {
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://$mcp_upstream;
        proxy_set_header Host $http_host;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend_test:5000;
        proxy_set_header Host $http_host;
    }

    location ^~ /oauth/ {
        proxy_pass http://backend_test:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass         http://backend_test:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # Frontend SPA
    # ------------------------------------------------------------------
    location / {
        root /home/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
